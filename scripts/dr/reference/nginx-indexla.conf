# Reference nginx — indexla.tech (no live deploy commit token)
# Install to /etc/nginx/sites-available/indexla then certbot for TLS.

server {
    server_name indexla.tech www.indexla.tech;

    location = /og.png {
        root /var/www/IndexLa/public;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Deploy-Commit unknown always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header X-Deploy-Commit unknown always;
        add_header Cache-Control "private, no-cache, must-revalidate" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/indexla.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indexla.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name indexla.tech www.indexla.tech;
    return 301 https://$host$request_uri;
}
