name: Deploy to Production
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger zero-downtime deployment
        uses: appleboy/ssh-action@v1
        with:
          host: indexla.tech
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # Install the deploy script from origin/master BEFORE running it,
          # so a push that hardens deploy does not run the old unsafe script.
          script: |
            set -euo pipefail
            APP_DIR="${INDEXLA_APP_DIR:-/var/www/IndexLa}"
            cd "$APP_DIR"
            git fetch origin master
            git show origin/master:scripts/deploy-indexla.sh > /usr/local/bin/deploy-indexla.sh
            chmod +x /usr/local/bin/deploy-indexla.sh
            /usr/local/bin/deploy-indexla.sh
